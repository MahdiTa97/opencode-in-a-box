name: opencode-docker

services:
  # One-shot: gives the named volumes to the host user, then exits.
  init:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: opencode-docker-opencode:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R ${HOST_UID:-1000}:${HOST_GID:-1000} /data /cache"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - oc-data:/data
      - oc-cache:/cache
    restart: "no"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

  opencode:
    image: opencode-docker-opencode:local
    env_file: [.env]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    init: true
    cap_drop: ["ALL"]
    # Nothing the agent writes may survive outside a volume: no persistence in
    # the image layers, so a compromised tool cannot leave a backdoor behind.
    read_only: true
    security_opt:
      - no-new-privileges:true
      # Replaces Docker's default profile with the same allowlist minus 57
      # escape primitives (mount, ptrace, bpf, unshare, io_uring, keyctl, ...).
      # Regenerate with: node scripts/gen-seccomp.mjs
      - seccomp=./seccomp/opencode.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      # Rebuilt from the host config at every start; nothing needs to persist.
      - /home/dev/.config:rw,noexec,nosuid,size=16m
      - /home/dev/.local/state:rw,noexec,nosuid,size=16m
    pids_limit: 1024
    mem_limit: 4g
    depends_on:
      init:
        condition: service_completed_successfully
    networks: [edge, egress]
    volumes:
      # The host config directory is mounted read-only at a non-global path.
      # If it were mounted at ~/.config/opencode it would load as the *global*
      # config, and OPENCODE_CONFIG only overrides keys it defines — so `browse`
      # and the credential-less providers would survive into the running server.
      - ${HOST_HOME:?HOST_HOME is not set - run ./setup.sh}/.config/opencode:/home/dev/host-config:ro
      # Credentials: the OpenCode console account lives in the oc-data volume.
      # No gateway key files are mounted, so the overlay drops those providers.
      # Projects, read-write. Edit this line to mount a different root.
      # PROJECTS_DIR is the only host tree the container can read and write.
      - ${PROJECTS_DIR:?PROJECTS_DIR is not set - run ./setup.sh}:/work
      - oc-data:/home/dev/.local/share/opencode
      - oc-cache:/home/dev/.cache/opencode
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      # The container talks to its own server over loopback; never proxy that.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"opencode:$$OPENCODE_PASSWORD\" http://127.0.0.1:4097/api/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    # Pinned by digest for the same reason as the node base image. Override
    # with NGINX_IMAGE=... in .env when pulling from a mirror.
    image: ${NGINX_IMAGE:-nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10}
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "127.0.0.1:8080:8080"
      - "[::1]:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      opencode:
        condition: service_healthy
    networks: [edge, egress]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    internal: true
  egress:

volumes:
  oc-data:
  oc-cache:
